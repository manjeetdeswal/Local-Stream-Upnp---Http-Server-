<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in - LocalStream</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/app.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <form id="loginForm" class="login-card" autocomplete="on">
    <img src="/icon-192.png" alt="" class="login-logo">
    <h1>LocalStream</h1>
    <p class="meta">Sign in to see the media shared from this PC.</p>
    <label>Username <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="remember" checked> Remember me on this device (30 days)</label>
    <div id="loginError" class="message error" hidden></div>
    <button id="btnLogin" class="btn btn-primary" type="submit">Sign in</button>
  </form>
</body>
</html>
